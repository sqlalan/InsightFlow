# ----------------------------------------------------------------------
# Perfil "local": banco em memoria, para rodar a API sem credencial do Neon.
# Ative com: mvn spring-boot:run -Dspring-boot.run.profiles=local
# Os dados somem quando a aplicacao para - use so para desenvolvimento.
# ----------------------------------------------------------------------
spring.datasource.url=jdbc:h2:mem:ctiinsights;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

spring.h2.console.enabled=true
spring.h2.console.path=/h2

cors.allowed-origins=http://localhost:5173,http://localhost:4173
