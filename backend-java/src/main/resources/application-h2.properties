spring.application.name=cti-insights

# Database H2 em-memória para testes
spring.datasource.url=jdbc:h2:mem:ctiinsights;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=false
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# H2 Console (opcional: acesso em http://localhost:8080/h2-console)
spring.h2.console.enabled=true

# Upload da planilha
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# Modulo Python de analise
analytics.python.executable=${PYTHON_BIN:python}
analytics.python.script=${ANALYTICS_DIR:../analytics-python}/analise.py
analytics.python.output=${ANALYTICS_DIR:../analytics-python}/output
analytics.upload-dir=${UPLOAD_DIR:uploads}
analytics.timeout-seconds=120

# CORS para frontend local
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:5174,http://localhost:4173}

server.port=${PORT:8080}
