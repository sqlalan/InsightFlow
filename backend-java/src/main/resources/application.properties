spring.application.name=cti-insights

# ----------------------------------------------------------------------
# Banco de dados - Azure Database for PostgreSQL (nuvem)
# Credenciais vem de variaveis de ambiente: nunca versionar senha no Git.
# ----------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/ctiinsights}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# ----------------------------------------------------------------------
# Upload da planilha
# ----------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ----------------------------------------------------------------------
# Modulo Python de analise (acionado via ProcessBuilder)
# ----------------------------------------------------------------------
analytics.python.executable=${PYTHON_BIN:python}
analytics.python.script=${ANALYTICS_DIR:../analytics-python}/analise.py
analytics.python.output=${ANALYTICS_DIR:../analytics-python}/output
analytics.upload-dir=${UPLOAD_DIR:uploads}
analytics.timeout-seconds=120

# ----------------------------------------------------------------------
# CORS - dominio do Front-end publicado na Vercel
# ----------------------------------------------------------------------
cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173,http://localhost:4173}

server.port=${PORT:8080}

auth.admin-email=${AUTH_ADMIN_EMAIL:}
auth.admin-password=${AUTH_ADMIN_PASSWORD:}
